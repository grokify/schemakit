site_name: SchemaKit
site_description: JSON Schema toolkit for Go developers
site_url: https://grokify.github.io/schemakit/
repo_url: https://github.com/grokify/schemakit
repo_name: grokify/schemakit

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
    - Installation: guides/installation.md
    - Spec Documentation: guides/spec-documentation.md
    - Go-First Workflow: guides/go-first-workflow.md
    - Commands:
      - Overview: guides/commands/index.md
      - lint: guides/commands/lint.md
      - generate: guides/commands/generate.md
      - doc: guides/commands/doc.md
    - Reference:
      - Lint Checks: guides/reference/lint-checks.md
      - Profiles: guides/reference/profiles.md
  - Releases:
    - v0.5.0: releases/v0.5.0.md
    - v0.4.0: releases/v0.4.0.md
    - v0.3.0: releases/v0.3.0.md
    - v0.2.0: releases/v0.2.0.md
    - v0.1.0: releases/v0.1.0.md
  - Changelog: changelog.md
